<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rachel's Workouts</title>
<meta name="description" content="Rachel's lunchtime kettlebell workouts, with a timer, a log and progress tracking.">
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15191E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--app-body-->
<main id="app" aria-live="polite"></main>

<nav class="nav" id="nav" aria-label="Sections">
  <div class="nav-in">
    <a href="#today" data-tab="today"><span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 21a7 7 0 1 1 14 0z" fill="currentColor"/></svg></span>Today</a>
    <a href="#plan" data-tab="plan"><span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>Plan</a>
    <a href="#history" data-tab="history"><span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 10h16M9 3v4M15 3v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>History</a>
    <a href="#me" data-tab="me"><span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>Me</a>
  </div>
</nav>

<div class="timer" id="timer" hidden role="timer" aria-live="off">
  <div class="t-wrap">
    <div class="t-demo" id="t-demo" hidden></div>
    <div class="t-phase" id="t-phase">Rest</div>
    <div class="t-clock" id="t-clock">0:00</div>
    <div class="t-label" id="t-label"></div>
    <div class="t-track"><i id="t-bar"></i></div>
    <div class="t-btns">
      <button type="button" id="t-pause">Pause</button>
      <button type="button" id="t-add">+15s</button>
      <button type="button" id="t-skip">Skip</button>
      <button type="button" id="t-stop">Stop</button>
    </div>
  </div>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>
<!--/app-body-->
<script src="js/program.js"></script>
<script src="js/demos.js"></script>
<script src="js/figure.js"></script>
<script src="js/app.js"></script>
</body>
</html>
